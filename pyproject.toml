[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disconnected-kws"
version = "0.1.0"
readme = "README.md"
description = "Disconnected-KWS implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "torch>=2.2", "soundfile>=0.12"]

[tool.setuptools.packages.find]
include = ["earadapt*"]
